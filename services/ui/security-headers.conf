# ---------------------------------------------------------------------------
#  Security headers, in an include rather than written once at server level.
#
#  nginx inherits add_header from an outer block ONLY when the inner block
#  declares none of its own. The SPA and asset locations both set
#  Cache-Control, which would silently drop every header below - including on
#  index.html, the one response that most needs them. Including this file in
#  each such location is what keeps them present.
#
#  always: send them on error responses too, not just 2xx.
# ---------------------------------------------------------------------------

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The SPA loads its own hashed bundles and calls only its own origin, so
# script-src and connect-src are 'self' with no exceptions. style-src allows
# inline because React writes element style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# frame-ancestors above is the modern form; this is sent as well because not
# every scanner or older browser reads the CSP one.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
