# ---------------------------------------------------------------------------
#  Serves the built SPA and proxies the two APIs, so the browser only ever
#  talks to one origin and there is no CORS to arrange.
#
#  Order matters: /api/assistant must be matched before /api, or every assistant
#  call would be forwarded to the ontology service and 404.
#
#  TLS: the entrypoint writes a self-signed certificate to /etc/nginx/certs if
#  none is mounted there, so the image is usable immediately and a real
#  certificate is a volume mount rather than a rebuild. A self-signed cert
#  makes the browser warn on first visit; that is the intended signal that this
#  is not yet a production certificate.
# ---------------------------------------------------------------------------

# Port 80 carries only the redirect and the health probe.
server {
    listen 80;
    server_name _;

    # The compose healthcheck has no TLS trust store to validate a self-signed
    # certificate against, so it probes here and is not redirected.
    location = /health {
        proxy_pass http://ontology-service:4000/health;
        proxy_set_header Host $host;
    }

    # $host carries no port, so this redirect targets the standard 443. That is
    # correct wherever the stack is published on 443, and wrong in local
    # development, where compose maps container 443 to host 3000 and nginx has
    # no way to learn that external port. Locally, browse to the HTTPS port
    # directly (https://127.0.0.1:3000); this listener exists for the redirect
    # in a real deployment and for the healthcheck above.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 is retained because some corporate proxies still terminate at it;
    # everything below that is off.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # Do not advertise the exact nginx build to every caller.
    server_tokens off;

    # A chat turn can carry a long question; nothing here needs more.
    client_max_body_size 2m;

    # The assistant can spend a while in a tool-calling loop against a local
    # model; the default 60s proxy_read_timeout cuts that off mid-answer.
    location /api/assistant/ {
        proxy_pass http://ai-fde:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://ontology-service:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The login throttle counts failures per username and logs the source
        # address; without these it would record nginx as the only client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://ontology-service:4000/health;
        proxy_set_header Host $host;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers loading a stale bundle that references missing chunks.
    location /assets/ {
        # add_header alone, not `expires 1y` as well: the two together emitted
        # two Cache-Control headers on every asset.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: every unmatched path renders the app so client-side routes
    # like /dashboards/control-tower survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
